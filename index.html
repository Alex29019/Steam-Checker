<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Account Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg"></canvas>

  <main class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M11.979 0C5.678 0 .511 4.86 0 11.03l6.44 2.66a3.62 3.62 0 0 1 2.05-.63c.09 0 .18 0 .27.01l2.86-4.14v-.06a4.83 4.83 0 1 1 4.83 4.83h-.11l-4.08 2.91c0 .08.01.16.01.24a3.63 3.63 0 0 1-7.22.62L0 15.7C.73 20.42 4.83 24 11.98 24 18.6 24 24 18.6 24 12S18.6 0 11.979 0zM7.16 18.42l-1.44-.6a2.73 2.73 0 0 0 3.63 1.44 2.73 2.73 0 0 0 1.44-3.54 2.73 2.73 0 0 0-3.53-1.44c-.28.12-.53.28-.74.48l1.49.62a2.01 2.01 0 1 1-1.55 3.7l.7-.66zM17.47 8.83a3.22 3.22 0 1 0-6.44 0 3.22 3.22 0 0 0 6.44 0zm-5.63 0a2.42 2.42 0 1 1 4.84 0 2.42 2.42 0 0 1-4.84 0z"/>
      </svg>
    </div>

    <h1>Steam Account Checker</h1>
    <p class="subtitle">Проверка валидности аккаунта Steam</p>

    <form id="form" autocomplete="off">
      <div class="field">
        <input type="text" id="username" placeholder=" " spellcheck="false" required>
        <label for="username">Логин</label>
      </div>
      <div class="field">
        <input type="password" id="password" placeholder=" " required>
        <label for="password">Пароль</label>
      </div>
      <button type="submit" id="submitBtn">
        <span class="btn-text">Проверить аккаунт</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>

    <div id="result" class="result" role="status" aria-live="polite"></div>

    <div id="guardBox" class="guard hidden">
      <p class="guard-title">Требуется код Steam Guard</p>
      <p class="guard-sub" id="guardSub">Код отправлен на email или в приложение</p>
      <div class="guard-row">
        <input id="guardInput" type="text" inputmode="text" maxlength="6"
               placeholder="XXXXX" autocomplete="one-time-code">
        <button id="guardBtn" type="button" class="btn-guard">OK</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
  </html>
